<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>رحلة القلوب - لعبة خاصة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; }
        .card { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.4); position: relative; }
        h1 { font-size: 24px; margin-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        p { font-size: 16px; margin-bottom: 20px; line-height: 1.4; color: #4a4a4a; }
        .btn { background: #ff4b72; color: white; border: none; padding: 12px 28px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,75,114,0.4); transition: transform 0.2s; }
        .btn:active { transform: scale(0.95); }
        #game-area { width: 100%; height: 300px; background: rgba(255,255,255,0.4); border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; }
        .heart { position: absolute; font-size: 30px; cursor: pointer; user-select: none; animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .score-board { font-size: 18px; font-weight: bold; color: #ff2a5f; margin-bottom: 10px; }
        .hidden { display: none; }
        .love-msg { font-size: 20px; color: #d63384; font-weight: bold; margin-top: 15px; animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- الشاشة الأولى -->
    <div id="screen-start" class="card">
        <h1>💖 مرحباً بكِ يا أجمل هدية 💖</h1>
        <p>هذه اللعبة صُممت خصيصاً لكِ! اجمعي القلوب لتفتحي المفاجأة الخاصة والمخبأة بالداخل.</p>
        <button class="btn" onclick="startGame()">ابدئي اللعب الآن ✨</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="screen-game" class="card hidden">
        <div class="score-board">القلوب المجمعة: <span id="score">0</span> / 15</div>
        <div id="game-area"></div>
        <p style="font-size: 14px; color: #666;">اضغطي على القلوب السريعة قبل اختفائها!</p>
    </div>

    <!-- شاشة الفوز والمفاجأة -->
    <div id="screen-win" class="card hidden">
        <h1>🎉 مبروك يا أميرتي! 🎉</h1>
        <p>لقد نجحتِ في جمع كل القلوب!</p>
        <div class="love-msg">
            "أنتِ لستِ فقط جزءاً من حياتي، أنتِ كل حياتي. أحبكِ جداً! ❤️"
        </div>
        <br><br>
        <button class="btn" onclick="location.reload()">إعادة اللعب 🔄</button>
    </div>

    <script>
        let score = 0;
        const targetScore = 15;
        const gameArea = document.getElementById('game-area');

        function startGame() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            spawnHeart();
        }

        function spawnHeart() {
            if (score >= targetScore) return;

            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';

            const maxX = gameArea.clientWidth - 40;
            const maxY = gameArea.clientHeight - 40;

            heart.style.left = Math.random() * maxX + 'px';
            heart.style.top = Math.random() * maxY + 'px';

            heart.onclick = function() {
                score++;
                document.getElementById('score').innerText = score;
                heart.remove();
                if (score >= targetScore) {
                    endGame();
                } else {
                    spawnHeart();
                }
            };

            gameArea.appendChild(heart);

            setTimeout(() => {
                if (heart.parentElement) {
                    heart.remove();
                    spawnHeart();
                }
            }, 1200);
        }

        function endGame() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-win').classList.remove('hidden');
        }
    </script>
</body>
</html>
